<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DailyStox</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">DS</span>
        <div>
          <h1>DailyStox</h1>
          <p id="status">Starting market feed...</p>
        </div>
      </div>
      <div class="index-strip" id="indexStrip" aria-label="Major indexes"></div>
    </header>

    <main class="layout">
      <section class="portfolio-panel">
        <div class="panel-head">
          <div>
            <h2>Watchlist</h2>
            <p id="portfolioSummary">$0.00 total value</p>
          </div>
          <button id="refreshBtn" class="icon-button" title="Refresh quotes" aria-label="Refresh quotes">Refresh</button>
        </div>

        <form id="addForm" class="add-form">
          <input id="symbolInput" autocomplete="off" placeholder="Ticker" aria-label="Ticker symbol" required>
          <input id="sharesInput" type="number" min="0" step="0.0001" placeholder="Shares" aria-label="Shares">
          <input id="costInput" type="number" min="0" step="0.01" placeholder="Avg cost" aria-label="Average cost">
          <button type="submit">Add</button>
        </form>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Price</th>
                <th>Day</th>
                <th>Day %</th>
                <th>Shares</th>
                <th>Value</th>
                <th>Volume</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="watchRows"></tbody>
          </table>
        </div>
      </section>

      <section class="chart-panel">
        <div class="chart-head">
          <div>
            <h2 id="chartTitle">Select a ticker</h2>
            <p id="chartMeta">Chart data appears here.</p>
          </div>
          <div class="range-tabs" id="rangeTabs" aria-label="Chart range"></div>
        </div>
        <div class="chart-canvas-wrap">
          <canvas id="chart" width="1200" height="560"></canvas>
          <div id="chartTooltip" class="chart-tooltip" hidden></div>
        </div>
        <div class="stats-grid" id="statsGrid"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
