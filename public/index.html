<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DailyStox</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">DS</span>
        <div>
          <h1>DailyStox</h1>
          <p id="status">Starting market feed...</p>
        </div>
      </div>
      <div class="index-strip" id="indexStrip" aria-label="Major indexes"></div>
      <button id="signOutBtn" class="icon-button" type="button">Sign out</button>
    </header>

    <main class="layout">
      <section class="portfolio-panel">
        <div class="panel-head">
          <div>
            <h2>Watchlist</h2>
            <p id="portfolioSummary">$0.00 total value</p>
          </div>
          <button id="refreshBtn" class="icon-button" title="Refresh quotes" aria-label="Refresh quotes">Refresh</button>
        </div>

        <form id="addForm" class="add-form">
          <input id="symbolInput" autocomplete="off" placeholder="Ticker" aria-label="Ticker symbol" required>
          <input id="sharesInput" type="number" min="0" step="0.0001" placeholder="Shares" aria-label="Shares">
          <input id="costInput" type="number" min="0" step="0.01" placeholder="Avg cost" aria-label="Average cost">
          <button type="submit">Add</button>
        </form>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Price</th>
                <th>Day</th>
                <th>Day %</th>
                <th>Shares</th>
                <th>Value</th>
                <th>Volume</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="watchRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div class="chart-modal" id="chartModal" hidden>
      <div class="chart-panel chart-modal-panel" id="chartModalPanel">
        <div class="chart-head">
          <div>
            <h2 id="modalChartTitle">Select a ticker</h2>
            <p id="modalChartMeta">Chart data appears here.</p>
          </div>
          <div class="modal-controls">
            <div class="range-tabs" id="modalRangeTabs" aria-label="Chart range"></div>
            <a id="modalExpandBtn" class="icon-button" href="#">Full screen</a>
            <button id="modalCloseBtn" class="icon-button" type="button" aria-label="Close chart">Close</button>
          </div>
        </div>
        <div class="chart-canvas-wrap">
          <canvas id="modalChart"></canvas>
          <div id="modalChartTooltip" class="chart-tooltip" hidden></div>
        </div>
        <div class="stats-grid" id="modalStatsGrid"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
    <script src="/supabase-config.js"></script>
    <script src="/auth-client.js"></script>
    <script src="/shared.js"></script>
    <script src="/chart-render.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
